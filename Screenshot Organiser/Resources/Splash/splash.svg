<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (For Rounded Square) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Folder Front Surface Gradient -->
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Photo Window Gradient -->
    <linearGradient id="photoSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>

    <!-- Mountain Gradient 1 -->
    <linearGradient id="mountGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <!-- Mountain Gradient 2 -->
    <linearGradient id="mountGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <!-- Clip path matching enlarged rounded square bounds -->
    <clipPath id="appIconClip">
      <rect x="56" y="56" width="400" height="400" rx="84" ry="84"/>
    </clipPath>
  </defs>

  <!-- Full Canvas Background (White) -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- ENLARGED APP ICON ROUNDED SQUARE (POSITIONED FURTHER FROM TOP) -->
  <rect x="56" y="56" width="400" height="400" rx="84" ry="84" fill="url(#bgGrad)"/>

  <!-- LOGO ARTWORK INSIDE ROUNDED SQUARE (ENLARGED & SHIFTED DOWN) -->
  <g clip-path="url(#appIconClip)">
    <g transform="translate(32, 92) scale(0.87)">
      
      <!-- BACK WINDOW (Orange/Red) -->
      <g transform="rotate(-12, 210, 190)">
        <rect x="150" y="130" width="140" height="110" rx="14" fill="#38BDF8" stroke="#1E293B" stroke-width="7"/>
        <path d="M 150,144 A 14,14 0 0,1 164,130 L 276,130 A 14,14 0 0,1 290,144 L 290,160 L 150,160 Z" fill="#1E3A8A"/>
        <circle cx="166" cy="145" r="4" fill="#EF4444"/>
        <circle cx="178" cy="145" r="4" fill="#F59E0B"/>
        <rect x="158" y="168" width="124" height="64" rx="6" fill="#F97316"/>
      </g>

      <!-- FRONT WINDOW (Photo Image) -->
      <g transform="rotate(8, 300, 180)">
        <rect x="210" y="110" width="170" height="135" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="8"/>
        <path d="M 210,126 A 16,16 0 0,1 226,110 L 364,110 A 16,16 0 0,1 380,126 L 380,145 L 210,145 Z" fill="#2563EB"/>
        <circle cx="228" cy="127" r="4.5" fill="#EF4444"/>
        <circle cx="242" cy="127" r="4.5" fill="#F59E0B"/>
        <circle cx="256" cy="127" r="4.5" fill="#10B981"/>
        
        <g stroke="#1E293B" stroke-width="4" stroke-linejoin="round">
          <rect x="220" y="152" width="150" height="83" rx="8" fill="url(#photoSky)"/>
          <circle cx="250" cy="175" r="10" fill="#F59E0B" stroke="none"/>
          <polygon points="265,235 315,185 365,235" fill="url(#mountGrad1)"/>
          <polygon points="220,235 270,180 325,235" fill="url(#mountGrad2)"/>
        </g>
      </g>

      <!-- FOLDER BACK WALL -->
      <path d="M 125,200 L 387,200 A 24,24 0 0,1 411,224 L 411,350 A 28,28 0 0,1 383,378 L 129,378 A 28,28 0 0,1 101,350 L 101,224 A 24,24 0 0,1 125,200 Z" fill="#1E3A8A" stroke="#0F172A" stroke-width="8" stroke-linejoin="round"/>

      <!-- FOLDER FRONT COVER WITH TAB -->
      <g>
        <path d="M 128,228 
                 L 220,228 
                 C 232,228 240,234 246,242 
                 L 256,254 
                 C 260,258 266,262 274,262 
                 L 384,262 
                 A 24,24 0 0,1 408,286 
                 L 408,352 
                 A 28,28 0 0,1 380,380 
                 L 132,380 
                 A 28,28 0 0,1 104,352 
                 L 104,252 
                 A 24,24 0 0,1 128,228 Z" 
              fill="url(#folderGrad)" 
              stroke="#0F172A" 
              stroke-width="8" 
              stroke-linejoin="round"/>
              
        <path d="M 130,234 L 218,234 C 226,234 232,238 237,245 L 247,257 C 253,265 261,268 272,268 L 382,268 A 18,18 0 0,1 400,286" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
      </g>

      <!-- GEAR ICON (LEFT) -->
      <g transform="translate(180, 312)">
        <path d="M 0,-42 
                 L 7,-42 L 11,-33 L 20,-29 L 28,-34 L 33,-28 L 29,-19 L 33,-11 L 42,-7 L 42,0
                 L 42,7 L 33,11 L 29,20 L 34,28 L 28,33 L 19,29 L 11,33 L 7,42 L 0,42
                 L -7,42 L -11,33 L -20,29 L -28,34 L -33,28 L -29,19 L -33,11 L -42,7 L -42,0
                 L -42,-7 L -33,-11 L -29,-20 L -34,-28 L -28,-33 L -19,-29 L -11,-33 L -7,-42 Z" 
              fill="#E2E8F0" stroke="#0F172A" stroke-width="8" stroke-linejoin="round"/>
        <circle cx="0" cy="0" r="15" fill="url(#folderGrad)" stroke="#0F172A" stroke-width="8"/>
      </g>

      <!-- ARROWS & LAYERS ICON (RIGHT) -->
      <g transform="translate(325, 310)">
        <g stroke="#0F172A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M -18,-18 L -18,0" stroke="#E2E8F0" stroke-width="7"/>
          <path d="M -18,-18 L -18,0"/>
          <path d="M -26,-10 L -18,-18 L -10,-10" stroke="#E2E8F0" stroke-width="7"/>
          <path d="M -26,-10 L -18,-18 L -10,-10"/>

          <path d="M 18,-2 L 18,-20" stroke="#E2E8F0" stroke-width="7"/>
          <path d="M 18,-2 L 18,-20"/>
          <path d="M 10,-10 L 18,-2 L 26,-10" stroke="#E2E8F0" stroke-width="7"/>
          <path d="M 10,-10 L 18,-2 L 26,-10"/>
        </g>

        <g stroke="#0F172A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="#CBD5E1">
          <polygon points="0,10 24,20 0,30 -24,20" fill="#E2E8F0"/>
          <path d="M -24,28 L 0,38 L 24,28" fill="none"/>
          <path d="M -24,36 L 0,46 L 24,36" fill="none"/>
        </g>
        
        <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8">
          <polygon points="0,12 20,20 0,28 -20,20"/>
        </g>
      </g>

    </g>
  </g>
</svg>
